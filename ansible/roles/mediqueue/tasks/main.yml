- name: Install Python runtime and venv support
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Create application system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

- name: Copy application source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/"
    dest: "{{ app_directory }}/app/"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart MediQueue

- name: Copy requirements file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: "{{ app_directory }}/requirements.txt"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"
  notify: Restart MediQueue

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ app_directory }}/venv"
    creates: "{{ app_directory }}/venv/bin/python"

- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ app_directory }}/requirements.txt"
    virtualenv: "{{ app_directory }}/venv"

- name: Install systemd service unit
  ansible.builtin.template:
    src: mediqueue.service.j2
    dest: /etc/systemd/system/mediqueue.service
    mode: "0644"
  notify: Restart MediQueue

- name: Enable and start MediQueue service
  ansible.builtin.systemd:
    name: mediqueue
    enabled: true
    state: started
    daemon_reload: true
