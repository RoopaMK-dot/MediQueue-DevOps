apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediqueue
  labels:
    app: mediqueue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mediqueue
  template:
    metadata:
      labels:
        app: mediqueue
    spec:
      containers:
        - name: mediqueue
          image: mediqueue:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
